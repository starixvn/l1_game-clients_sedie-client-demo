include:
    - project: ci/core-cicd
      ref: main
      file: luminet.gitlab-ci.yml
variables:
  BYPASS_CRITICAL_VULNERABILITY: "true"     

.base_transform_config:
  stage: transform-config
  tags:
    - docker

  script:
    - echo "====== Build Monorepo ======"
    - echo $DEPLOY_ENV
    - echo $STACK_NAME
    - |
      if [ "$STACK_NAME" = "l1" ]; then
        STACK_VALUE="sg"
      elif [ "$STACK_NAME" = "l2" ]; then
        STACK_VALUE="vg"
      else
        echo "Invalid STACK_NAME value"
        exit 1
      fi
    - |
      if [ "$STACK_VALUE" != "sg" ]; then
        cp ./seal-monorepo/libs/saba-games/configs/$STACK_VALUE/configs.$DEPLOY_ENV.json ./seal-monorepo/libs/saba-games/configs/sg/configs.LOCAL_1.json
      else
        cp ./seal-monorepo/libs/saba-games/configs/sg/configs.$DEPLOY_ENV.json ./seal-monorepo/libs/saba-games/configs/sg/configs.LOCAL_1.json.tmp && mv ./seal-monorepo/libs/saba-games/configs/sg/configs.LOCAL_1.json.tmp ./seal-monorepo/libs/saba-games/configs/sg/configs.LOCAL_1.json
      fi
    - cat ./seal-monorepo/libs/saba-games/configs/sg/configs.LOCAL_1.json

  artifacts:
    paths:
      - ./seal-monorepo/libs/saba-games/configs/sg/configs.LOCAL_1.json
    expire_in: 1 day


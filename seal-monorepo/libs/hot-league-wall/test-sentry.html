<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentry Test - Fixed Version</title>
</head>
<body>
    <h1>Sentry Test Page - Fixed Version</h1>
    <p>This page tests if Sentry is properly configured and working after the beforeSend fix.</p>
    
    <button onclick="testSentryError()">Test Error Logging</button>
    <button onclick="testSentryInfo()">Test Info Logging</button>
    <button onclick="testSentryWarning()">Test Warning Logging</button>
    <button onclick="checkSentryStatus()">Check Sentry Status</button>
    <button onclick="testBeforeSend()">Test BeforeSend Hook</button>
    
    <div id="output"></div>

    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }

        function testSentryError() {
            log('🧪 Testing Sentry error logging...');
            try {
                throw new Error('Test error from HTML page - should now be sent to Sentry');
            } catch (error) {
                log('Error caught: ' + error.message);
                
                if (window.Sentry) {
                    window.Sentry.captureException(error);
                    log('✅ Sentry error logged via window.Sentry');
                } else {
                    log('❌ window.Sentry not available');
                }
            }
        }

        function testSentryInfo() {
            log('📝 Testing Sentry info logging...');
            if (window.Sentry) {
                window.Sentry.captureMessage('Test info message from HTML page - should now be sent to Sentry', 'info');
                log('✅ Sentry info logged');
            } else {
                log('❌ window.Sentry not available');
            }
        }

        function testSentryWarning() {
            log('⚠️ Testing Sentry warning logging...');
            if (window.Sentry) {
                window.Sentry.captureMessage('Test warning message from HTML page - should now be sent to Sentry', 'warning');
                log('✅ Sentry warning logged');
            } else {
                log('❌ window.Sentry not available');
            }
        }

        function testBeforeSend() {
            log('🔧 Testing BeforeSend hook...');
            if (window.Sentry) {
                // This should trigger the beforeSend hook and show logs
                window.Sentry.captureMessage('BeforeSend test message', 'info');
                log('✅ BeforeSend test message sent - check console for beforeSend logs');
            } else {
                log('❌ window.Sentry not available');
            }
        }

        function checkSentryStatus() {
            log('🔍 Checking Sentry status...');
            
            if (window.Sentry) {
                log('✅ window.Sentry is available');
                log('Sentry version: ' + (window.Sentry.VERSION || 'unknown'));
                
                // Check if Sentry is initialized
                try {
                    const client = window.Sentry.getCurrentHub().getClient();
                    if (client) {
                        log('✅ Sentry client is initialized');
                        log('Sentry DSN: ' + (client.getDsn()?.host || 'unknown'));
                        log('Sentry environment: ' + (client.getOptions().environment || 'unknown'));
                    } else {
                        log('❌ Sentry client is not initialized');
                    }
                } catch (error) {
                    log('❌ Error checking Sentry client: ' + error.message);
                }
            } else {
                log('❌ window.Sentry is not available');
            }
            
            if (window.SentryManager) {
                log('✅ window.SentryManager is available');
            } else {
                log('❌ window.SentryManager is not available');
            }
            
            if (window.SentryConsole) {
                log('✅ window.SentryConsole is available');
            } else {
                log('❌ window.SentryConsole is not available');
            }
        }

        // Auto-check status on load
        window.addEventListener('load', function() {
            log('🚀 Page loaded, checking Sentry status...');
            setTimeout(checkSentryStatus, 1000);
        });
    </script>
</body>
</html>

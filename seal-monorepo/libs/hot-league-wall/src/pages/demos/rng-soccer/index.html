<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="sport-item">
        <div class="wrapper-sport-top">
            <div class="game-name">
                <div class="game-name-text">
                    RNG Soccer
                    <img src="./images/live-icon.svg" alt="live" class="live-icon">
                </div>
                <div class="game-name-round">#37699</div>
            </div>
            <div class="score-board-img"><img src="./images/bxh.svg" alt="bxh"></div>
        </div>

        <div class="wrapper-sport-middle">
            <div class="sport-team home-team">
                <div class="sport-team-img">
                    <img src="./images/home-default-logo.svg" alt="home-team" class="">
                </div>
                <div class="sport-team-name">Man.city</div>
            </div>
            <div class="sport-result">
                <div class="container-result">
                    <div class="card-section">
                        <img src="./images/cards/card-back.svg" alt="card" />
                    </div>
                    <div class="result-section">
                        <div class="result">
                            <span>0</span>
                        </div>
                        <div class="result">
                            <span>12</span>
                        </div>
                    </div>
                    <div class="card-section">
                        <img src="./images/cards/card-back.svg" alt="card" />
                    </div>
                </div>
                <div class="timer">
                    <!-- <div class="count-down">00:35</div> -->
                    <div class="dots"></div>
                </div>
            </div>
            <div class="sport-team away-team">
                <div class="sport-team-img">
                    <img src="./images/away-default-logo.svg" alt="home-team" class="">
                </div>
                <div class="sport-team-name">Arsenal</div>
            </div>
        </div>

        <div class="wrapper-sport-bottom">
            <div class="bet-option">
                <div class="bet-option-item">
                    <span class="team">Home</span>
                    <span class="score">2.00</span>
                </div>
                <div class="bet-option-item">
                    <span class="team">Draw</span>
                    <span class="score">11.00</span>
                </div>
                <div class="bet-option-item active">
                    <span class="team">Away</span>
                    <span class="score">2.00</span>
                </div>
            </div>
        </div>

        <div class="wrapper-popup">
            <div class="history-block">
                <div class="history-block-item">
                    <span>Home</span>
                    <span>43%</span>
                </div>
                <div class="history-block-item">
                    <span>Draw</span>
                    <span>10%</span>
                </div>
                <div class="history-block-item">
                    <span>Away</span>
                    <span>43%</span>
                </div>
            </div>
            <div class="close-popup">
                <img src="./images/close.svg" alt="close" class="close-icon">
            </div>
        </div>
    </div>
</body>

</html>
